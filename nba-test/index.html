<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>NBA Engine Test</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Pyodide phone test: can the iPhone run the real PE_NBA.py, how fast, and do the
   plays match the Mac? Same look as halftime/index.html. */
:root {
  --bg: #f3f5f7; --card: #ffffff; --fg: #17202a; --muted: #5c6875; --line: #d9dfe5; --accent: #1f5fbf;
  --ok: #1d7a46; --ok-bg: #e3f3ea; --warn: #7a5b00; --warn-bg: #fbf1d4; --bad: #b3261e; --bad-bg: #fbe7e5;
  --sans: "IBM Plex Sans", system-ui, -apple-system, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f1419; --card: #182029; --fg: #e6ebf0; --muted: #93a1af; --line: #2a3540; --accent: #6ea2f0;
  --ok: #6fd39a; --ok-bg: #173325; --warn: #e8c766; --warn-bg: #352c12; --bad: #f2948c; --bad-bg: #3a1c1a; color-scheme: dark } }
html { background: var(--bg); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 var(--sans);
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px)); padding-block: 16px 60px; }
main { max-width: 620px; margin: 0 auto; display: grid; gap: 12px; }
h1 { font-size: 1.3rem; margin: 0; }
h2 { font-size: 1rem; margin: 0; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
[hidden] { display: none !important; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; min-width: 0; }
button, .filebtn { font: 600 0.95rem var(--sans); background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 12px 14px; cursor: pointer; text-align: center; }
.filebtn.secondary, button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); padding: 9px 12px; }
button:disabled { opacity: 0.5; cursor: default; }
button:focus-visible, .filebtn:focus-within, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
input[type=file] { position: absolute; opacity: 0; width: 1px; height: 1px; }
#run { width: 100%; font-size: 1.05rem; padding: 14px; }
.notice { padding: 8px 10px; border-radius: 8px; font-size: 0.88rem; background: var(--warn-bg); color: var(--warn); }
.notice.ok { background: var(--ok-bg); color: var(--ok); }
.notice.bad { background: var(--bad-bg); color: var(--bad); }
.banner { font-weight: 600; font-size: 1rem; }
table { border-collapse: collapse; width: 100%; font-size: 0.88rem; }
td { padding: 5px 4px; border-top: 1px solid var(--line); vertical-align: top; }
tr:first-child td { border-top: 0; }
td.num { text-align: right; font: 0.85rem var(--mono); overflow-wrap: anywhere; }
td.mark { width: 1.6em; text-align: center; }
.fname { font: 0.8rem var(--mono); overflow-wrap: anywhere; }
details summary { cursor: pointer; font-weight: 600; font-size: 0.9rem; }
pre { font: 0.72rem/1.35 var(--mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 50vh; overflow: auto;
  background: var(--bg); border-radius: 8px; padding: 8px; margin: 8px 0 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
</style>
</head>
<body>
<main>
  <header>
    <h1>NBA engine phone test</h1>
    <div class="muted small">Runs your real PE_NBA.py on this phone (Pyodide 0.28.3) and checks the plays against the Mac's run.</div>
  </header>

  <section class="card" aria-labelledby="py-h">
    <h2 id="py-h">1 · Python</h2>
    <div id="pystatus" class="notice">Starting Python…</div>
  </section>

  <section class="card" aria-labelledby="files-h">
    <h2 id="files-h">2 · Files</h2>
    <div class="muted small">In Files, open iCloud Drive › PropEdge Phone Test, tap Select, select all 5 files and tap Open.</div>
    <div class="row">
      <label class="filebtn secondary" for="files">Choose files<input type="file" id="files" multiple></label>
      <span id="fcount" class="muted small">None chosen</span>
    </div>
    <table id="ftable" aria-label="Files chosen"></table>
  </section>

  <button id="run" disabled>Run engine</button>

  <section class="card" id="result" hidden aria-labelledby="res-h" aria-live="polite">
    <h2 id="res-h">3 · Result</h2>
    <div id="banner" class="notice banner"></div>
    <table id="rtable" aria-label="Comparison with the Mac"></table>
    <table id="ttable" aria-label="Timings"></table>
    <div class="row">
      <button class="secondary" id="copy">Copy report</button>
      <span id="copied" class="muted small"></span>
    </div>
    <details><summary>Engine output</summary><pre id="log"></pre></details>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/pyodide/v0.28.3/full/pyodide.js"></script>
<script>
// Mac reference: harness.py run with PE_NBA.py v1.19 on these exact files (2026-11-25)
const EXPECTED = {
  engine_version: '1.19',
  files: ['NBA_2026-11-25-200pm_FD_All-Day.csv', 'OddsAPI_NBA_Pick6_2026-11-25_14-04-51.csv',
          'OddsAPI_NBA_PrizePicks_2026-11-25_14-04-51.csv', 'OddsAPI_NBA_Underdog_2026-11-25_14-04-51.csv'],
  plays: { Pick6: 95, PrizePicks: 538, Underdog: 200 },
  lineups: { Underdog: 2, PrizePicks: 5 },
  n_leftovers: 7, n_checklist: 58,
  fp: { plays: '90f1b0fcea5b', lineups: 'b87fb71aa591', leftovers: 'e5d925ddef4d', checklist: 'be2f4e0708af' },
  t_engine_mac: 0.86,
};
const HOME = '/home/pyodide';
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const secs = ms => (ms / 1000).toFixed(1) + ' s';
const paint = () => new Promise(r => requestAnimationFrame(() => setTimeout(r, 30)));

let py = null;
let pyReady = false;      // Python + pandas + harness loaded
const boot = {};          // startup timings (ms)
const chosen = {};        // role -> {file, label, version}
let lastReport = '';

// --- 1. Python: starts on page load, so a reload measures the cached start ---
async function startPython() {
  const t0 = performance.now();
  try {
    py = await loadPyodide();
    boot.python = performance.now() - t0;
    $('pystatus').textContent = `Python started in ${secs(boot.python)}. Loading pandas…`;
    const t1 = performance.now();
    await py.loadPackage(['pandas']);
    py.runPython('import pandas, numpy');
    boot.pandas = performance.now() - t1;
    const harness = await (await fetch('harness.py?v=1', { cache: 'no-store' })).text();
    py.FS.writeFile(`${HOME}/harness.py`, harness);
    py.runPython(`import sys; sys.path.insert(0, '${HOME}')`);
    boot.total = performance.now() - t0;
    pyReady = true;
    $('pystatus').className = 'notice ok';
    $('pystatus').textContent = `Ready in ${secs(boot.total)}: Python ${secs(boot.python)}, pandas ${secs(boot.pandas)}.`;
  } catch (e) {
    $('pystatus').className = 'notice bad';
    $('pystatus').textContent = `Python didn't start: ${e.message || e}`;
    py = null;
  }
  updateRun();
}

// --- 2. Files: role from the file name ---
function roleOf(name) {
  if (/\.py$/i.test(name)) return 'engine';
  const m = name.match(/^OddsAPI_NBA_(Pick6|PrizePicks|Underdog|Betr)_.*\.csv$/i);
  if (m) return 'odds:' + m[1];
  if (/^NBA_.*\.csv$/i.test(name)) return 'sabersim';
  return null;
}
const LABEL = { engine: 'Engine', sabersim: 'SaberSim' };

$('files').addEventListener('change', async e => {
  const skipped = [];
  for (const f of e.target.files) {
    const role = roleOf(f.name);
    if (!role) { skipped.push(f.name); continue; }
    let version = '';
    if (role === 'engine') {
      const m = (await f.text()).match(/^# Version:\s*(\S+)/m);
      version = m ? 'v' + m[1] : '';
    }
    chosen[role] = { file: f, label: LABEL[role] || role.split(':')[1], version };
  }
  e.target.value = '';
  renderFiles(skipped);
  updateRun();
});

function renderFiles(skipped = []) {
  const order = ['engine', 'sabersim', 'odds:Pick6', 'odds:Underdog', 'odds:PrizePicks', 'odds:Betr'];
  const rows = order.filter(r => chosen[r]).map(r => {
    const c = chosen[r];
    return `<tr><td class="mark">✅</td><td>${esc(c.label)} ${esc(c.version)}</td><td class="fname">${esc(c.file.name)}</td></tr>`;
  });
  for (const need of ['engine', 'sabersim']) {
    if (!chosen[need]) rows.push(`<tr><td class="mark">◻️</td><td>${LABEL[need]}</td><td class="muted small">not chosen yet</td></tr>`);
  }
  if (!Object.keys(chosen).some(r => r.startsWith('odds:')))
    rows.push('<tr><td class="mark">◻️</td><td>Odds API lines</td><td class="muted small">not chosen yet</td></tr>');
  for (const s of skipped) rows.push(`<tr><td class="mark">➖</td><td>Ignored</td><td class="fname">${esc(s)}</td></tr>`);
  $('ftable').innerHTML = rows.join('');
  const n = Object.keys(chosen).length;
  $('fcount').textContent = n ? `${n} file${n > 1 ? 's' : ''} ready` : 'None chosen';
}

function ready() {
  return pyReady && chosen.engine && chosen.sabersim && Object.keys(chosen).some(r => r.startsWith('odds:'));
}
function updateRun() { $('run').disabled = !ready(); }

// --- 3. Run: write the files where the engine looks, run harness.py ---
$('run').addEventListener('click', async () => {
  if (!ready()) return;
  $('run').disabled = true;
  $('run').textContent = 'Running…';
  $('result').hidden = true;
  await paint();
  const t0 = performance.now();
  try {
    const FS = py.FS;
    for (const dir of [`${HOME}/Downloads`, `${HOME}/engine`]) {
      FS.mkdirTree(dir);
      for (const f of FS.readdir(dir)) if (f !== '.' && f !== '..') FS.unlink(`${dir}/${f}`);
    }
    for (const [role, c] of Object.entries(chosen)) {
      const bytes = new Uint8Array(await c.file.arrayBuffer());
      FS.writeFile(role === 'engine' ? `${HOME}/engine/PE_NBA.py` : `${HOME}/Downloads/${c.file.name}`, bytes);
    }
    const t1 = performance.now();
    const out = JSON.parse(py.runPython(
      `import json, importlib, harness\nimportlib.reload(harness)\njson.dumps(harness.run('${HOME}/engine'))`));
    show(out, { write: t1 - t0, run: performance.now() - t1 });
  } catch (e) {
    $('result').hidden = false;
    $('banner').className = 'notice bad banner';
    $('banner').textContent = '❌ The run failed. The error is under Engine output.';
    $('rtable').innerHTML = $('ttable').innerHTML = '';
    $('log').textContent = String(e.message || e);
    lastReport = 'Run failed:\n' + String(e.message || e).slice(-3000);
  }
  $('run').textContent = 'Run again';
  updateRun();
});

function fmtCounts(o) { return Object.entries(o).map(([k, v]) => `${k} ${v}`).join(' · ') || 'none'; }
function same(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function show(r, t) {
  $('result').hidden = false;
  $('log').textContent = r.log || '';
  if (!r.ok) {
    $('banner').className = 'notice bad banner';
    $('banner').textContent = '❌ ' + r.error;
    $('rtable').innerHTML = $('ttable').innerHTML = '';
    lastReport = 'Run failed: ' + r.error;
    return;
  }
  const names = Object.entries(chosen).filter(([k]) => k !== 'engine').map(([, c]) => c.file.name).sort();
  const comparable = same(names, [...EXPECTED.files].sort()) && r.engine_version === EXPECTED.engine_version;
  const checks = [
    ['Plays', fmtCounts(r.plays), r.fp.plays === EXPECTED.fp.plays],
    ['Lineups', fmtCounts(r.lineups), r.fp.lineups === EXPECTED.fp.lineups],
    ['Leftovers', String(r.n_leftovers), r.fp.leftovers === EXPECTED.fp.leftovers],
    ['Pick6 check list', `${r.n_checklist} rows`, r.fp.checklist === EXPECTED.fp.checklist],
  ];
  const allSame = comparable && checks.every(c => c[2]);
  if (!comparable) {
    $('banner').className = 'notice banner';
    $('banner').textContent = 'Ran, but these aren\'t the files the Mac reference used, so there\'s nothing to compare with.';
  } else {
    $('banner').className = 'notice banner ' + (allSame ? 'ok' : 'bad');
    $('banner').textContent = allSame ? '✅ Same plays, lineups and check list as the Mac'
                                      : '❌ Different from the Mac (see the rows marked ❌)';
  }
  $('rtable').innerHTML = checks.map(([k, v, ok]) =>
    `<tr><td class="mark">${comparable ? (ok ? '✅' : '❌') : '·'}</td><td>${k}</td><td class="num">${esc(v)}</td></tr>`).join('');
  const times = [
    ['Python start (this page load)', secs(boot.total)],
    ['Engine run', `${r.t_engine.toFixed(1)} s (Mac ${EXPECTED.t_engine_mac.toFixed(1)} s)`],
    ['Lineups + check list', `${r.t_views.toFixed(1)} s`],
    ['Tap to result', secs(t.write + t.run)],
    ['Versions', `Python ${r.python} · pandas ${r.pandas} · engine v${r.engine_version}`],
  ];
  $('ttable').innerHTML = times.map(([k, v]) => `<tr><td>${k}</td><td class="num">${esc(v)}</td></tr>`).join('');
  lastReport = [
    `NBA engine phone test, ${new Date().toLocaleString()}`,
    `${navigator.userAgent}`,
    `Result: ${comparable ? (allSame ? 'SAME as Mac' : 'DIFFERENT from Mac') : 'not comparable (other files)'}`,
    ...checks.map(([k, v, ok]) => `${k}: ${v} ${comparable ? (ok ? 'ok' : 'DIFF') : ''}`),
    `Python start ${secs(boot.total)} (Python ${secs(boot.python)}, pandas ${secs(boot.pandas)})`,
    `Engine ${r.t_engine} s, views ${r.t_views} s, tap to result ${secs(t.write + t.run)}`,
    `Python ${r.python}, pandas ${r.pandas}, numpy ${r.numpy}, engine v${r.engine_version}`,
    `fp ${JSON.stringify(r.fp)}`,
  ].join('\n');
}

$('copy').addEventListener('click', async () => {
  try { await navigator.clipboard.writeText(lastReport); $('copied').textContent = 'Copied ✓'; }
  catch (e) { $('copied').textContent = 'Copy failed; long-press the result instead.'; }
  setTimeout(() => { $('copied').textContent = ''; }, 2000);
});

renderFiles();
startPython();
</script>
</body>
</html>
